name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # Mirror /portfolio/index.html → /portfolio/portafolio.html so both URLs
      # serve the same bytes. Single source of truth = index.html in repo.
      - name: Sync Portafolio mirror page
        run: cp landing/portfolio/index.html landing/portfolio/portafolio.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing --project-name=nicolasbiondi --branch=master
