  <main class="contact-page" id="main">
    <div class="contact-info">
      <h1>Nicolás Biondi</h1>
      <p class="contact-role">Fotógrafo</p>
      <p><a href="mailto:nicolas@lenz.pe">nicolas@lenz.pe</a></p>
    </div>

    <form class="contact-form" id="contact-form" action="https://formspree.io/f/placeholder" method="POST" novalidate>
      <div class="form-group">
        <label for="mensaje">Mensaje <span aria-hidden="true">*</span></label>
        <textarea
          id="mensaje"
          name="mensaje"
          rows="5"
          required
          autocomplete="off"
          placeholder="¿En qué puedo ayudarte…?"
          aria-required="true"
        ></textarea>
      </div>
      <div class="form-group">
        <label for="nombre">Nombre <span aria-hidden="true">*</span></label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          required
          autocomplete="name"
          placeholder="Tu nombre…"
          aria-required="true"
          spellcheck="false"
        />
      </div>
      <div class="form-group">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          placeholder="tu@email.com"
          aria-required="true"
          spellcheck="false"
          inputmode="email"
        />
      </div>
      <button type="submit" class="btn-send">Enviar mensaje</button>
      <p
        class="form-status"
        id="form-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </form>
  </main>

    </a>
    <a href="https://www.instagram.com/nicolasbiondi" target="_blank" rel="noopener" aria-label="Instagram de Nicolás Biondi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    </a>
    <a href="https://www.linkedin.com/in/nicol%C3%A1s-biondi-97098210b/" target="_blank" rel="noopener" aria-label="LinkedIn de Nicolás Biondi">
